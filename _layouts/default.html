<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="lantern-glow"></div>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">The Lantern Room</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Chapters</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>The Lantern Room &middot; a 100-day story &middot; written by Alberth Nahas</p>
  </footer>
</body>
</html>
